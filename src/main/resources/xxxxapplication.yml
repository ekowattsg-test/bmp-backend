security.jwt.token.secret-key: my-secret-key

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/jwt
    username: root
    password: password
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    open-in-view: false

project:
  gps:
    nearby-radius-meters: ${PROJECT_GPS_NEARBY_RADIUS_METERS}
