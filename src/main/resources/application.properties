spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
server.port=${SERVER_PORT}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
jwt.secret=${JWT_SECRET}
logging.level.com.hcteol.jwt.backend.controllers=DEBUG
# enable verbose service logs and write logs to a file for post-run inspection
logging.level.com.hcteol.jwt.backend.services=DEBUG
logging.file.name=app.log

tv.auth.challenge-expiry-seconds=${TV_AUTH_CHALLENGE_EXPIRY_SECONDS}
tv.auth.session-max-seconds=${TV_AUTH_SESSION_MAX_SECONDS}
tv.auth.exchange-code-expiry-seconds=${TV_AUTH_EXCHANGE_CODE_EXPIRY_SECONDS}
tv.auth.poll-interval-seconds=${TV_AUTH_POLL_INTERVAL_SECONDS}
tv.auth.refresh-interval-seconds=${TV_AUTH_REFRESH_INTERVAL_SECONDS}
tv.auth.require-pin=${TV_AUTH_REQUIRE_PIN}
tv.auth.default-destination-url=${TV_AUTH_DEFAULT_DESTINATION_URL}
tv.auth.qr-scheme-base=${TV_AUTH_QR_SCHEME_BASE}
project.gps.nearby-radius-meters=${PROJECT_GPS_NEARBY_RADIUS_METERS}
auto.generate.hold.movements=${AUTO_GENERATE_HOLD_MOVEMENTS:false}